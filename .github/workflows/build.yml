name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Käytetään äärimmäisen vakautettua p4a-versiota

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        # Asennetaan vain välttämättömät kääntötyökalut, zip ja unzip
        sudo apt-get install -y libtool automake autoconf gettext python3-pip unzip zip duniverse build-essential
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython<3.0"

    - name: Build with Buildozer
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1" # Kertoo Buildozerille, että lisenssit on automaattisesti hyväksytty
        BUILDOZER_WARN_ON_ROOT: "0"
      run: |
        # Putkitetaan varmuuden vuoksi 'yes' kaikkiin kysymyksiin
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: moode-audio-apk
        path: bin/*.apk
