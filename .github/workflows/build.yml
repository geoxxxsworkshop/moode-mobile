name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: date
      run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ runner.os }}-${{ steps.date.outputs.date }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        # Asennetaan peruskääntäjät ja Android SDK:n vaatimat työkalut (kuten unzip ja openjdk)
        sudo apt-get install -y libtool automake autoconf gettext python3-pip unzip openjdk-17-jdk
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Setup Android SDK Command Line Tools
      run: |
        # Luodaan Android SDK:n vaatimat kansiot valmiiksi, jotta sdkmanager löytyy luotettavasti
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        cd ~/.buildozer/android/platform/android-sdk/cmdline-tools
        # Ladataan viralliset Google Android -komentorivityökalut
        wget -q https://google.com -O tools.zip
        unzip -q tools.zip
        mv cmdline-tools latest || true
        rm tools.zip

    - name: Pre-accept Android SDK Licenses
      run: |
        # Hyväksytään lisenssit luomalla oikeat allekirjoitustiedostot
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n9477386" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Build with Buildozer
      run: |
        # Suoritetaan lopullinen käännös
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: moode-audio-apk
        path: bin/*.apk
